name: mote
version: 0.1.0
manifest_version: 2
api_version: 1
description: Write documents in Mote and see them. Renders Mote source to page images the agent can look at, and exports editable Word, PowerPoint and PDF files.
author: Magister AI
license: MIT
homepage: https://github.com/magisterai/hermes-mote
tags: [documents, docx, pptx, pdf, office]
requires_hermes: ">=0.21.5"
provides_tools:
  - mote_render
  - mote_export
provides_hooks: []
config_schema:
  mote_path:
    type: str
    default: ""
    description: "Path of the mote executable. Empty means PATH, then ~/.cargo/bin/mote."
